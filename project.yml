# Perfect Fit · Xcode project (generated with `xcodegen generate`; don't edit the .xcodeproj by hand)
name: PerfectFit
options:
  bundleIdPrefix: com.blubergames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PerfectFitCore:
    path: Packages/PerfectFitCore
settings:
  base:
    DEVELOPMENT_TEAM: CGW77RJS5Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # dev-install.sh overrides these to install "Perfect Fit Dev" next to the App Store app
    BUNDLE_ID_SUFFIX: ""
    APP_DISPLAY_NAME: "Perfect Fit"
    APP_ICON_SUFFIX: ""
targets:
  PerfectFit:
    type: application
    platform: iOS
    sources:
      - path: PerfectFit
        excludes:
          - Resources
      # one folder reference per kind of content (a top-level "Resources" folder breaks iOS code signing)
      - path: PerfectFit/Resources/Models
        type: folder
        buildPhase: resources
      - path: PerfectFit/Resources/Textures
        type: folder
        buildPhase: resources
      - path: PerfectFit/Resources/Levels
        type: folder
        buildPhase: resources
      - path: PerfectFit/Resources/Intro
        type: folder
        buildPhase: resources
    dependencies:
      - package: PerfectFitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blubergames.perfectfit$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: PerfectFit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APP_ICON_SUFFIX)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PerfectFit/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: PerfectFit/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchWhite
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
